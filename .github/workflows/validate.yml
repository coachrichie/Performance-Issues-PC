name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON configuration
        shell: powershell
        run: |
          Get-Content .\Config\diagnostics.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .\Config\tools.json -Raw | ConvertFrom-Json | Out-Null

      - name: Install Pester 3.4.0
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run test suite
        shell: powershell
        run: |
          Invoke-Pester -Script .\Tests -PassThru

      - name: Run dry diagnostics
        shell: powershell
        run: |
          .\Start-Diagnose.ps1 -DryRun -OutputRoot "$env:RUNNER_TEMP\ToolkitOutput"
